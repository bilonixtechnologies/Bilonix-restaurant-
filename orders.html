<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orders | BILONIX Restaurant Pro</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="sidebar">

<h2>BILONIX</h2>

<ul>
<li><i class="fas fa-chart-line"></i> Dashboard</li>
<li><i class="fas fa-utensils"></i> Menu</li>
<li><i class="fas fa-receipt"></i> Orders</li>
<li><i class="fas fa-chair"></i> Tables</li>
<li><i class="fas fa-boxes"></i> Inventory</li>
</ul>

</div>

<div class="main">

<h1>New Order</h1>
<div class="card">

<h2>Current Order</h2>

<p>Items:
<span id="cart-count">0</span>
</p>

<p>Total:
<strong id="cart-total">$0.00</strong>
</p>

<button>Checkout</button>

</div>


<div class="card">
<h3>🍔 Burger</h3>
<p>$8.00</p>
<button>Add</button>
</div>

<div class="card">
<h3>🍕 Pizza</h3>
<p>$12.00</p>
<button>Add</button>
</div>

<div class="card">
<h3>🥤 Soft Drink</h3>
<p>$3.00</p>
<button>Add</button>
</div>

<div class="card">
<h3>🍗 Chicken</h3>
<p>$10.00</p>
<button>Add</button>
</div>

</div>

</div>
<script src="js/orders.js"></script>
</body>
</html>
